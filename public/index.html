<!DOCTYPE html>
<html>
<head>
  <base href="." />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3e%3cdefs%3e%3cstyle%3e.bg %7b fill: %23333333; %7d .stroke %7b stroke: %2329B6F6; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; %7d .accent %7b fill: %2329B6F6; %7d .star %7b fill: %23FFFFFF; %7d%3c/style%3e%3c/defs%3e%3cpath class='bg stroke' d='M20 5 H70 L95 30 V95 H20 Z'/%3e%3cpath class='stroke' fill='none' d='M70 5 V30 H95'/%3e%3ccircle class='accent' cx='50' cy='55' r='28'/%3e%3cpath class='accent' d='M35 83 L50 72 L65 83 Z'/%3e%3cpath class='star' d='M50 42 l 5 10 l 10 5 l -10 5 l -5 10 l -5 -10 l -10 -5 l 10 -5 Z'/%3e%3c/svg%3e">
  <title>Agente IA</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-left">
        <svg class="app-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#3b82f6" />
              <stop offset="100%" stop-color="#8b5cf6" />
            </linearGradient>
          </defs>
          <path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 2V8H20" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 13H8" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 17H8" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 9H9H8" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <h1>Tus Agentes IA</h1>
          <p>Elige tu asistente inteligente</p>
        </div>
      </div>
      <div class="header-tabs">
        <button class="tab-btn active" data-mode="capacitaciones"><strong>Agente Capacitaciones</strong> (Actividad sincronica 3)</button>
        <button class="tab-btn" data-mode="curzas"><strong>IA Curzas</strong> (Actividad asincronica 3)</button>
        <button class="tab-btn" data-mode="practica3"><strong>Práctica 3</strong> (Subir PDF)</button>
      </div>
    </header>
  
    <div class="main-content mode-ia">
      <div class="left-section">
        <div class="upload-section">
          <label for="pdf-upload" class="upload-label">
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 15V3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Arrastra tu PDF aquí o haz click para seleccionar</span>
          </label>
          <input type="file" id="pdf-upload" accept=".pdf" />
          <div class="search-section">
            <input type="text" id="search-input" placeholder="Buscar en el PDF..." />
            <button id="search-button">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Buscar
            </button>
          </div>
        </div>
        <div id="pdf-preview" class="pdf-preview">
          <div id="pdf-content" class="pdf-content"></div>
        </div>
      </div>
  
      <div class="resizer" id="dragMe"></div>

      <section class="chat-section">
        <div id="chat-messages" class="chat-messages"></div>
        <div class="input-section">
          <button id="voice-toggle-btn" class="icon-btn active" title="Voz IA Activada">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="24" height="24">
              <path d="M11 5L6 9H2V15H6L11 19V5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path class="voice-waves" d="M15.54 8.46C16.4774 9.39764 17.004 10.6692 17.004 11.995C17.004 13.3208 16.4774 14.5924 15.54 15.53M19.07 4.93C20.9447 6.80527 21.9979 9.34836 21.9979 12C21.9979 14.6516 20.9447 17.1947 19.07 19.07" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="mic-toggle-btn" class="icon-btn" title="Activar Micrófono">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="24" height="24">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <input type="text" id="question-input" placeholder="Haz tu pregunta sobre el PDF..." />
          <button id="send-button">Enviar</button>
        </div>
      </section>
    </div>
  </div>
  
  <footer class="footer">
      <!-- El footer se puede añadir de nuevo si se desea, lo he quitado para simplificar -->
  </footer>
  
  <script src="./js/modules/voice.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
